title: Celestino Advogados
description: Advocacia em Direito de Família e Direito do Passageiro Aéreo.
# PROVISÓRIO — enquanto o site é revisado no endereço do GitHub Pages.
# No dia da publicação: url vira https://celestinoadvogados.com.br e baseurl volta a "".
url: https://cafe01.github.io
baseurl: "/celestinoadvogados.site"
lang: pt-BR

permalink: /artigos/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: artigo

# A landing de aviação tem chrome próprio e não passa por layout nenhum:
# sem front matter, o Jekyll a copia inteira como arquivo estático.
exclude:
  - voo/LEIA-ME.txt

plugins:
  - jekyll-feed
  - jekyll-seo-tag
